{% extends "base.html" %}{% block content %}<h1>Ordens de Serviço</h1><section class="panel"><form method="post" class="form"><input name="cliente" placeholder="Cliente" required><input name="telefone" placeholder="WhatsApp"><input name="endereco" placeholder="Endereço"><textarea name="descricao" placeholder="Descrição"></textarea><select name="status"><option>Aberta</option><option>Em execução</option><option>Finalizada</option><option>Entregue</option></select><input name="data_execucao" placeholder="Data"><input name="valor_total" placeholder="Valor"><button>Criar OS</button></form></section><section class="panel">{% for o in ordens %}<div class="item"><b>{{ o[1] }}</b> — {{ o[2] }}<br>{{ o[3] }} — {{ o[4] }} — {{ moeda(o[5]) }}</div>{% else %}<p>Nenhuma OS.</p>{% endfor %}</section>{% endblock %}
