{% extends "base.html" %}{% block content %}<h1>Assinatura Digital</h1><section class="panel"><input id="nome" placeholder="Nome ou referência" class="full"><canvas id="canvas" width="360" height="220"></canvas><div class="row"><button onclick="limpar()">Limpar</button><button onclick="salvar()">Salvar assinatura</button></div><p id="msg"></p></section><script>const c=document.getElementById("canvas"),ctx=c.getContext("2d");let draw=false,last=null;function pos(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){draw=true;last=pos(e);e.preventDefault()}function move(e){if(!draw)return;const p=pos(e);ctx.lineWidth=3;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()}function end(){draw=false}c.addEventListener("mousedown",start);c.addEventListener("mousemove",move);window.addEventListener("mouseup",end);c.addEventListener("touchstart",start);c.addEventListener("touchmove",move);c.addEventListener("touchend",end);function limpar(){ctx.clearRect(0,0,c.width,c.height)}async function salvar(){const imagem=c.toDataURL("image/png"),nome=document.getElementById("nome").value||"assinatura";const r=await fetch("/assinatura/salvar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome,imagem})});const j=await r.json();document.getElementById("msg").innerText=j.ok?"Assinatura salva!":"Erro"}</script>{% endblock %}
