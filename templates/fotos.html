{% extends "base.html" %}{% block content %}<h1>Fotos Antes / Depois</h1><section class="panel"><form method="post" enctype="multipart/form-data" class="form"><select name="os_id"><option value="">Selecionar OS</option>{% for o in ordens %}<option value="{{ o[0] }}">{{ o[1] }} - {{ o[2] }}</option>{% endfor %}</select><select name="tipo"><option>Antes</option><option>Depois</option><option>Evidência técnica</option></select><input type="file" name="foto" accept="image/*" capture="environment"><textarea name="observacao" placeholder="Observação"></textarea><button>Enviar Foto</button></form></section><section class="panel">{% for f in fotos %}<div class="item"><b>{{ f[2] }}</b> — {{ f[4] }}<br>{{ f[3] }}<br>{{ f[5] }}</div>{% else %}<p>Nenhuma foto.</p>{% endfor %}</section>{% endblock %}
